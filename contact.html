<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Edwin Mainge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #121212; color: #ffffff;">

    <!-- En-tête -->
    <header class="site-header">
        <h1 class="site-title">mainge edwin</h1>
        <nav class="main-nav">
            <a href="index.html">Accueil</a>
            <a href="a-propos.html">À propos</a>
            <a href="competences.html">compétences</a>
            <a href="formations.html">Formations</a>
            <a href="veille.html">veille</a>
            <a href="entreprises.html">Entreprises</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <!-- Titre Principal -->
    <section class="skills-hero">
        <h2>Contact</h2>
    </section>

    <div class="divider-banner"></div>

    <!-- Conteneur Formulaire de Contact -->
    <section style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
        
        <div style="background-color: #1a1a1a; border: 1px solid #333333; border-radius: 8px; padding: 35px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);">
            
            <h3 style="font-size: 1.6rem; color: #e6c687; margin-bottom: 20px; text-align: center;">Me contacter</h3>

            <!-- Boutons de coordonnées directes -->
            <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-bottom: 35px;">
                <a href="mailto:edwinmainge@gmail.com" style="display: flex; align-items: center; gap: 8px; background-color: #262626; border: 1px solid #e6c687; color: #ffffff; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 0.9rem;">
                    📧 edwinmainge@gmail.com
                </a>
                <a href="tel:+596696560733" style="display: flex; align-items: center; gap: 8px; background-color: #262626; border: 1px solid #e6c687; color: #ffffff; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 0.9rem;">
                    📞 +596 696 56 07 33
                </a>
            </div>

            <!-- Formulaire -->
            <form action="https://formspree.io/f/ton_form_id" method="POST" style="display: flex; flex-direction: column; gap: 20px;">
                
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px;">
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="color: #cccccc; font-size: 0.9rem; text-align: left;">Prénom</label>
                        <input type="text" name="firstname" placeholder="Votre prénom" required style="background-color: #121212; border: 1px solid #444444; border-radius: 6px; padding: 12px; color: #ffffff; font-size: 1rem; outline: none;">
                    </div>
                    
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="color: #cccccc; font-size: 0.9rem; text-align: left;">Nom</label>
                        <input type="text" name="lastname" placeholder="Votre nom" required style="background-color: #121212; border: 1px solid #444444; border-radius: 6px; padding: 12px; color: #ffffff; font-size: 1rem; outline: none;">
                    </div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label style="color: #cccccc; font-size: 0.9rem; text-align: left;">Adresse Email</label>
                    <input type="email" name="email" placeholder="votre.email@exemple.com" required style="background-color: #121212; border: 1px solid #444444; border-radius: 6px; padding: 12px; color: #ffffff; font-size: 1rem; outline: none;">
                </div>

                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label style="color: #cccccc; font-size: 0.9rem; text-align: left;">Message</label>
                    <textarea name="message" rows="5" placeholder="Votre message..." required style="background-color: #121212; border: 1px solid #444444; border-radius: 6px; padding: 12px; color: #ffffff; font-size: 1rem; outline: none; resize: vertical;"></textarea>
                </div>

                <div style="text-align: center; margin-top: 10px;">
                    <button type="submit" style="background-color: #e6c687; color: #121212; font-weight: bold; border: none; padding: 12px 35px; border-radius: 6px; font-size: 1rem; cursor: pointer; transition: background-color 0.2s ease, transform 0.2s ease;">
                        Envoyer le message
                    </button>
                </div>

            </form>

        </div>

    </section>

</body>
</html>
